events {
    worker_connections 1024;
}

http {
    # Upstream configuration for Vault cluster
    upstream vault_backend {
        # Node 1 (local)
        server vault-node1:8200;
        
        # Node 2 (external)
        server NODE2_IP:8200;
        
        # Node 3 (external)
        server NODE3_IP:8200;
    }

    # Health check endpoint
    upstream vault_health {
        server vault-node1:8200;
    }

    server {
        listen 80;
        server_name _;

        # Health check endpoint
        location /health {
            proxy_pass http://vault_health/v1/sys/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Vault API endpoints
        location / {
            proxy_pass http://vault_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Vault specific headers
            proxy_set_header X-Vault-Request-Timeout "30";
            proxy_set_header X-Vault-Server "true";
            
            # Timeout settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
