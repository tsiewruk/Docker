# ===== SECRETS MANAGEMENT =====
secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
  grafana_smtp_password:
    file: ./secrets/grafana_smtp_password.txt
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
  wordpress_db_password:
    file: ./secrets/wordpress_db_password.txt
  rabbitmq_password:
    file: ./secrets/rabbitmq_password.txt
  jenkins_admin_password:
    file: ./secrets/jenkins_admin_password.txt

# ===== NETWORKS MANAGEMENT =====
networks:
  default:
    driver: bridge
  monitoring:
    driver: bridge
    internal: false
  web:
    driver: bridge
    internal: false

# ===== VOLUMES MANAGEMENT =====
volumes:
  jenkins_volume:
    external: true
  grafana_volume:
    external: true
  prometheus_volume:
    external: true
  mysql_data:
    driver: local

# ===== COMMON BUILD CONFIGURATION =====
x-common-build: &common-build
  args:
    cookbooks_dir: ../../shared

# ===== COMMON LOGGING CONFIGURATION =====
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# ===== COMMON RESOURCE PROFILES =====
x-resources-tiny: &resources-tiny
  limits:
    memory: 128M
    cpus: '0.25'
  reservations:
    memory: 64M
    cpus: '0.1'

x-resources-small: &resources-small
  limits:
    memory: 256M
    cpus: '0.25'
  reservations:
    memory: 128M
    cpus: '0.1'

x-resources-medium: &resources-medium
  limits:
    memory: 512M
    cpus: '0.5'
  reservations:
    memory: 256M
    cpus: '0.25'

x-resources-large: &resources-large
  limits:
    memory: 1G
    cpus: '0.75'
  reservations:
    memory: 512M
    cpus: '0.5'

x-resources-xlarge: &resources-xlarge
  limits:
    memory: 2G
    cpus: '1.0'
  reservations:
    memory: 1G
    cpus: '0.5'

x-resources-xxlarge: &resources-xxlarge
  limits:
    memory: 3G
    cpus: '2.0'
  reservations:
    memory: 1.5G
    cpus: '1.0'

# ===== COMMON SECURITY SETTINGS =====
x-security-default: &security-default
  security_opt:
    - no-new-privileges:true

x-security-user: &security-user
  <<: *security-default
  user: "1000:1000"

x-security-readonly: &security-readonly
  <<: *security-user
  read_only: true

# ===== COMMON HEALTHCHECK SETTINGS =====
x-healthcheck-fast: &healthcheck-fast
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

x-healthcheck-medium: &healthcheck-medium
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

x-healthcheck-slow: &healthcheck-slow
  interval: 60s
  timeout: 15s
  retries: 5
  start_period: 120s

# ===== SERVICES MANAGEMENT =====
services:
  debian-base:
    build:
      <<: *common-build
      context: ./base-images/debian-base-image
      args:
        image_builder_dir: .
      dockerfile: Dockerfile
    image: "debian-base:latest"
    deploy:
      resources: *resources-medium
    <<: *security-default
    read_only: false
    logging: *default-logging
    stdin_open: true
    tty: true

  traefik:
    build:
      <<: *common-build
      context: ./base-images/traefik
      args:
        image_builder_dir: .
        TRAEFIK_VERSION: '2.10.4'
      dockerfile: Dockerfile
    image: "traefik:latest"
    container_name: traefik
    hostname: traefik
    deploy:
      resources: *resources-medium
    <<: *security-user
    read_only: false
    environment:
      - TRAEFIK_CONFIG=local
      - CERT_CONFIG=local
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      <<: *healthcheck-medium
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/ping"]
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.local`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.priority=1"
    networks:
      - web
    logging: *default-logging
    restart: unless-stopped

  dev-container:
    build:
      <<: *common-build
      context: ./base-images/dev-container
      args:
        image_builder_dir: .
        ANSIBLE_VERSION: 2.9
        PYTHON_VERSION: 3.9
        TERRAFORM_VERSION: 1.3.7
        OPEN_TOFU_VERSION: 1.6.2
        HELM_VERSION: 3.14.4
      dockerfile: Dockerfile
    image: "dev-container:latest"
    hostname: dev-container
    container_name: dev-container
    deploy:
      resources: *resources-large
    <<: *security-user
    read_only: false
    logging: *default-logging
    stdin_open: true
    tty: true

  jenkins:
    build:
      <<: *common-build
      context: ./base-images/jenkins
      args:
        image_builder_dir: .
        OPEN_JDK_VERSION: 17
        JENKINS_VERSION: 1
      dockerfile: Dockerfile
    image: "jenkins:latest"
    hostname: jenkins
    container_name: jenkins
    deploy:
      resources: *resources-xxlarge
    user: "1000:1000"
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_volume:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      <<: *healthcheck-slow
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jenkins.rule=Host(`jenkins.local`)"
      - "traefik.http.routers.jenkins.service=jenkins"
      - "traefik.http.routers.jenkins.tls=true"
      - "traefik.http.services.jenkins.loadbalancer.server.port=8080"
    networks:
      - default
    logging: *default-logging
    restart: unless-stopped

  grafana:
    profiles: ["monitoring", "all"]
    build:
      <<: *common-build
      context: ./base-images/grafana
      args:
        image_builder_dir: .
        GRAFANA_VERSION: '10.1.4'
      dockerfile: Dockerfile
    image: "grafana:latest"
    container_name: grafana
    hostname: grafana
    deploy:
      resources: *resources-medium
    <<: *security-user
    secrets:
      - grafana_admin_password
      - grafana_smtp_password
    environment:
      - grafana_organization_name=MY_ORGANIZATION
      - grafana_organization_theme=dark
      - grafana_organization_weekstart=monday
      - grafana_organization_timezone=Europe/Warsaw
      - grafana_admin_name=Admin
      - grafana_admin_login=admin
      - grafana_admin_old_password=admin
      - grafana_admin_email=admin@example.com
      - smtp_user=monitoring
      - smtp_email=monitoring@example.com
      - instance_name=Grafana Monitoring
    ports:
      - "3000:3000"
    volumes:
      - grafana_volume:/var/lib/grafana
    healthcheck:
      <<: *healthcheck-medium
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.local`)"
      - "traefik.http.routers.grafana.service=grafana"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.priority=10"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    networks:
      - monitoring
    logging: *default-logging
    restart: unless-stopped

  prometheus:
    profiles: ["monitoring", "all"]
    build:
      <<: *common-build
      context: ./base-images/prometheus
      args:
        image_builder_dir: .
        PROMETHEUS_VERSION: 2.47.1
      dockerfile: Dockerfile
    image: "prometheus:latest"
    container_name: prometheus
    hostname: prometheus
    deploy:
      resources: *resources-large
    <<: *security-user
    read_only: false
    environment:
      - PROMETHEUS_URL=prometheus.local
    ports:
      - "9090:9090"
    volumes:
      - prometheus_volume:/etc/prometheus/
    tmpfs:
      - /tmp:size=100M,mode=1777
    healthcheck:
      <<: *healthcheck-medium
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.local`)"
      - "traefik.http.routers.prometheus.service=prometheus"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.priority=10"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
    networks:
      - monitoring
    logging: *default-logging
    restart: unless-stopped

  cadvisor:
    profiles: ["monitoring", "all"]
    build:
      <<: *common-build
      context: ./base-images/cadvisor
      args:
        image_builder_dir: .
        CADVISOR_VERSION: 0.47.2
      dockerfile: Dockerfile
    image: "cadvisor:latest"
    container_name: cadvisor
    hostname: cadvisor
    deploy:
      resources: *resources-small
    user: "1000:1000"
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    ports:
      - "8082:8080"
    volumes:
      - "/var/run:/var/run:ro"
      - "/sys:/sys:ro"
      - "/var/lib/docker/:/var/lib/docker:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/etc/machine-id:/etc/machine-id:ro"
      - "/var/lib/dbus/machine-id:/var/lib/dbus/machine-id:ro"
      - "/dev/disk/:/dev/disk:ro"
      - "/:/rootfs:ro"
    devices:
      - "/dev/kmsg:/dev/kmsg:r"
    healthcheck:
      <<: *healthcheck-fast
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cadvisor.rule=Host(`cadvisor.local`)"
      - "traefik.http.routers.cadvisor.service=cadvisor"
      - "traefik.http.routers.cadvisor.tls=true"
      - "traefik.http.routers.cadvisor.priority=10"
      - "traefik.http.services.cadvisor.loadbalancer.server.port=8080"
    networks:
      - monitoring
    logging: *default-logging
    restart: unless-stopped

  node-exporter:
    profiles: ["monitoring", "all"]
    build:
      <<: *common-build
      context: ./base-images/node-exporter
      args:
        image_builder_dir: .
        NODE_EXPORTER_VERSION: 1.7.0
      dockerfile: Dockerfile
    image: "node-exporter:latest"
    container_name: node-exporter
    hostname: node-exporter
    deploy:
      resources: *resources-tiny
    <<: *security-readonly
    ports:
      - "9100:9100"
    volumes:
      - '/:/host:ro,rslave'
    pid: host
    healthcheck:
      <<: *healthcheck-fast
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9100/metrics"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.node-exporter.rule=Host(`node-exporter.local`)"
      - "traefik.http.routers.node-exporter.service=node-exporter"
      - "traefik.http.routers.node-exporter.tls=true"
      - "traefik.http.routers.node-exporter.priority=10"
      - "traefik.http.services.node-exporter.loadbalancer.server.port=9100"
    networks:
      - monitoring
    logging: *default-logging
    restart: unless-stopped

  mysql-exporter:
    profiles: ["monitoring", "all"]
    build:
      <<: *common-build
      context: ./base-images/mysql-exporter
      args:
        image_builder_dir: .
        MYSQL_EXPORTER_VERSION: 0.15.1
      dockerfile: Dockerfile
    image: "mysql-exporter:latest"
    container_name: mysql-exporter
    hostname: mysql-exporter
    deploy:
      resources: *resources-tiny
    <<: *security-readonly
    ports:
      - "9104:9104"
    healthcheck:
      <<: *healthcheck-fast
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9104/metrics"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mysql-exporter.rule=Host(`mysql-exporter.local`)"
      - "traefik.http.routers.mysql-exporter.service=mysql-exporter"
      - "traefik.http.routers.mysql-exporter.tls=true"
      - "traefik.http.routers.mysql-exporter.priority=10"
      - "traefik.http.services.mysql-exporter.loadbalancer.server.port=9104"
    networks:
      - monitoring
    logging: *default-logging
    restart: unless-stopped

  alert-manager:
    profiles: ["monitoring", "all"]
    build:
      <<: *common-build
      context: ./base-images/alert-manager
      args:
        image_builder_dir: .
        ALERTMANAGER_VERSION: 0.26.0
      dockerfile: Dockerfile
    image: "alert-manager:latest"
    container_name: alert-manager
    hostname: alert-manager
    deploy:
      resources: *resources-small
    <<: *security-user
    read_only: false
    environment:
      - ALERTMANAGER_URL=alert-manager.local
    ports:
      - "9093:9093"
    healthcheck:
      <<: *healthcheck-fast
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alert-manager.rule=Host(`alert-manager.local`)"
      - "traefik.http.routers.alert-manager.service=alert-manager"
      - "traefik.http.routers.alert-manager.tls=true"
      - "traefik.http.routers.alert-manager.priority=10"
      - "traefik.http.services.alert-manager.loadbalancer.server.port=9093"
    networks:
      - monitoring
    logging: *default-logging
    restart: unless-stopped

  blackbox:
    profiles: ["monitoring", "all"]
    build:
      <<: *common-build
      context: ./base-images/blackbox
      args:
        image_builder_dir: .
        BLACKBOX_VERSION: 0.24.0
      dockerfile: Dockerfile
    image: "blackbox:latest"
    container_name: blackbox
    hostname: blackbox
    deploy:
      resources: *resources-tiny
    <<: *security-readonly
    ports:
      - "9115:9115"
    healthcheck:
      <<: *healthcheck-fast
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9115/metrics"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.blackbox.rule=Host(`blackbox.local`)"
      - "traefik.http.routers.blackbox.service=blackbox"
      - "traefik.http.routers.blackbox.tls=true"
      - "traefik.http.routers.blackbox.priority=10"
      - "traefik.http.services.blackbox.loadbalancer.server.port=9115"
    networks:
      - monitoring
    logging: *default-logging
    restart: unless-stopped

  wazuh-dashboard:
    profiles: ["security", "all"]
    build:
      <<: *common-build
      context: ./base-images/wazuh-dashboard
      args:
        image_builder_dir: .
        WAZUH_DASHBOARD_VERSION: 4.7
      dockerfile: Dockerfile
    image: "wazuh-dashboard:latest"
    container_name: wazuh-dashboard
    hostname: wazuh-dashboard
    deploy:
      resources: *resources-large
    <<: *security-user
    read_only: false
    ports:
      - "5601:5601"
    healthcheck:
      <<: *healthcheck-slow
      test: ["CMD", "curl", "-f", "http://localhost:5601/status"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wazuh-dashboard.rule=Host(`wazuh-dashboard.local`)"
      - "traefik.http.routers.wazuh-dashboard.service=wazuh-dashboard"
      - "traefik.http.routers.wazuh-dashboard.tls=true"
      - "traefik.http.routers.wazuh-dashboard.priority=10"
      - "traefik.http.services.wazuh-dashboard.loadbalancer.server.port=5601"
    networks:
      - default
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      wazuh-indexer:
        condition: service_healthy
      wazuh-server:
        condition: service_healthy

  wazuh-indexer:
    profiles: ["security", "all"]
    build:
      <<: *common-build
      context: ./base-images/wazuh-indexer
      args:
        image_builder_dir: .
        WAZUH_DASHBOARD_VERSION: 4.7
      dockerfile: Dockerfile
    image: "wazuh-indexer:latest"
    container_name: wazuh-indexer
    hostname: wazuh-indexer
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '1.5'
        reservations:
          memory: 2G
          cpus: '0.75'
    <<: *security-user
    read_only: false
    environment:
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    ports:
      - "9200:9200"
    tmpfs:
      - /tmp:size=100M,mode=1777
    healthcheck:
      <<: *healthcheck-medium
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wazuh-indexer.rule=Host(`wazuh-indexer.local`)"
      - "traefik.http.routers.wazuh-indexer.service=wazuh-indexer"
      - "traefik.http.routers.wazuh-indexer.tls=true"
      - "traefik.http.routers.wazuh-indexer.priority=10"
      - "traefik.http.services.wazuh-indexer.loadbalancer.server.port=9200"
    networks:
      - default
    logging: *default-logging
    restart: unless-stopped

  wazuh-server:
    profiles: ["security", "all"]
    build:
      <<: *common-build
      context: ./base-images/wazuh-server
      args:
        image_builder_dir: .
        WAZUH_SERVER_VERSION: 4.7
      dockerfile: Dockerfile
    image: "wazuh-server:latest"
    container_name: wazuh-server
    hostname: wazuh-server
    deploy:
      resources: *resources-large
    <<: *security-user
    read_only: false
    ports:
      - "1516:1516"
      - "55000:55000"
    healthcheck:
      <<: *healthcheck-medium
      test: ["CMD", "curl", "-f", "http://localhost:55000/"]
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wazuh-server.rule=Host(`wazuh-server.local`)"
      - "traefik.http.routers.wazuh-server.service=wazuh-server"
      - "traefik.http.routers.wazuh-server.tls=true"
      - "traefik.http.routers.wazuh-server.priority=10"
      - "traefik.http.services.wazuh-server.loadbalancer.server.port=1516"
    networks:
      - default
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      wazuh-indexer:
        condition: service_healthy

  varnish:
    profiles: ["web", "all"]
    build:
      <<: *common-build
      context: ./base-images/varnish
      args:
        image_builder_dir: .
      dockerfile: Dockerfile
    image: "varnish:latest"
    container_name: varnish
    hostname: varnish
    deploy:
      resources: *resources-medium
    <<: *security-user
    read_only: false
    environment:
      - VARNISH_CONFIG=default
    ports:
      - "6081:6081"
    healthcheck:
      <<: *healthcheck-fast
      test: ["CMD", "varnishstat", "-1"]
    networks:
      - web
    logging: *default-logging
    restart: unless-stopped

  rabbitmq:
    build:
      <<: *common-build
      context: ./base-images/rabbitmq
      args:
        image_builder_dir: .
      dockerfile: Dockerfile
    image: "rabbitmq:latest"
    container_name: rabbitmq
    hostname: rabbitmq
    deploy:
      resources: *resources-large
    <<: *security-default
    read_only: false
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS_FILE=/run/secrets/rabbitmq_password
    secrets:
      - rabbitmq_password
    ports:
      - "5672:5672"
      - "15672:15672"
      - "25672:25672"
    healthcheck:
      <<: *healthcheck-medium
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq.rule=Host(`rabbitmq.local`)"
      - "traefik.http.routers.rabbitmq.service=rabbitmq"
      - "traefik.http.routers.rabbitmq.tls=true"
      - "traefik.http.services.rabbitmq.loadbalancer.server.port=15672"
    networks:
      - default
    logging: *default-logging
    restart: unless-stopped

  wordpress:
    profiles: ["web", "all"]
    build:
      <<: *common-build
      context: ./base-images/wordpress
      args:
        image_builder_dir: .
        WORDPRESS_VERSION: 6.4.3
        PHP_VERSION: 8.2
      dockerfile: Dockerfile
    image: "wordpress:latest"
    container_name: wordpress
    hostname: wordpress
    deploy:
      resources: *resources-medium
    <<: *security-default
    read_only: false
    environment:
      - WORDPRESS_DB_HOST=mysql:3306
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD_FILE=/run/secrets/wordpress_db_password
      - WORDPRESS_DB_NAME=wordpress
    secrets:
      - wordpress_db_password
    ports:
      - "8083:80"
      - "8443:443"
    healthcheck:
      <<: *healthcheck-medium
      test: ["CMD", "curl", "-f", "http://localhost:80/wp-admin/install.php"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wordpress.rule=Host(`wordpress.local`)"
      - "traefik.http.routers.wordpress.service=wordpress"
      - "traefik.http.routers.wordpress.tls=true"
      - "traefik.http.routers.wordpress.priority=10"
      - "traefik.http.services.wordpress.loadbalancer.server.port=80"
    networks:
      - web
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    profiles: ["web", "all"]
    build:
      <<: *common-build
      context: ./base-images/mysql
      args:
        image_builder_dir: .
        MYSQL_VERSION: 8.29-1
        MYSQL_ROOT_PASS: default
      dockerfile: Dockerfile
    image: "mysql:latest"
    container_name: mysql
    hostname: mysql
    deploy:
      resources: *resources-large
    <<: *security-default
    read_only: false
    environment:
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/mysql_root_password
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=wordpress
      - MYSQL_PASSWORD_FILE=/run/secrets/wordpress_db_password
    secrets:
      - mysql_root_password
      - wordpress_db_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    shm_size: '256m'
    tmpfs:
      - /tmp:size=100M,mode=1777
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=512M
    healthcheck:
      <<: *healthcheck-medium
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      retries: 5
    networks:
      - web
    logging: *default-logging
    restart: unless-stopped